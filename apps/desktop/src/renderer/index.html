<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM Desktop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        try {
          const storedTheme = window.localStorage.getItem('theme');
          const theme =
            storedTheme === 'light' || storedTheme === 'dark'
              ? storedTheme
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';

          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell" aria-labelledby="app-title">
      <header class="leftHeader">
        <button id="sign-out" class="signOutButton" type="button" hidden>Sign out</button>
      </header>

      <header class="appHeader">
        <button id="theme-toggle" class="themeToggle" type="button" title="Toggle theme">
          <span class="srOnly">Toggle theme</span>
        </button>
      </header>

      <section id="login-screen" class="screen loginScreen">
        <div class="welcomeCopy">
          <h1 id="app-title">Welcome</h1>
          <p>This app is still in development.</p>
        </div>

        <form id="login-form" class="loginForm">
          <label>
            <span>Username</span>
            <input id="username" name="username" type="text" autocomplete="username" required />
          </label>

          <label>
            <span>Password</span>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </label>

          <button id="login-button" type="submit">Login</button>
          <p id="login-status" class="status" role="status"></p>
        </form>
      </section>

      <section id="next-screen" class="screen nextScreen" hidden>
        <h1>Setup</h1>
        <section class="setupSummary" aria-labelledby="setup-title">
          <div class="setupSummaryHeader">
            <h2 id="setup-title">Device setup</h2>
            <span id="setup-status" class="setupStatus">Checking</span>
          </div>
          <div id="setup-checks" class="setupChecks" aria-live="polite"></div>
        </section>
      </section>
    </main>

    <script src="./theme-icons.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
