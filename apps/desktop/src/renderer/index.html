<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM Desktop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        try {
          const storedTheme = window.localStorage.getItem('theme');
          const theme =
            storedTheme === 'light' || storedTheme === 'dark'
              ? storedTheme
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';

          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell" aria-labelledby="app-title">
      <header class="appHeader">
        <button id="theme-toggle" class="themeToggle" type="button" title="Toggle theme">
          <span class="srOnly">Toggle theme</span>
        </button>
      </header>

      <section class="screen">
        <p class="eyebrow">Desktop</p>
        <h1 id="app-title">LLM Desktop</h1>
        <p id="runtime" class="runtime" role="status">Starting</p>
      </section>
    </main>

    <script src="./theme-icons.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
